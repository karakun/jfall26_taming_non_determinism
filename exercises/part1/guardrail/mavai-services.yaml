format: mavai-services/1
services:
  advice-guardrail:
    type: guardrail                     # the health advice guardrail
    configuration:
      guardrail: llm                    # llm: a language model judges the advice; keyword: matching harmful phrases
      # The exercises ask the replay for this model (MAVAI_LLM_ENDPOINT in exercises/part1/.env).
      # The demo app takes its model and endpoint from app/providers.yaml instead.
      model: mistralai/Mistral-Small-4-119B-2603
      system-prompt: {file: guardrail-system-prompt.txt}
      temperature: 0.7                  # how much randomness goes into each answer
      max-tokens: 120
      response-schema:                  # the shape every answer must have
        type: object
        required: [harmful, reason]
        additionalProperties: false
        properties:
          harmful: {type: boolean}
          reason: {type: string}
    # Other configurations to explore next to the one above: uncomment `explorations:` and the line below it.
    # Each exploration changes one setting, so the report can show what caused a difference.
    # explorations:
    #   - {guardrail: keyword}            # the guardrail falls back to keyword matching
