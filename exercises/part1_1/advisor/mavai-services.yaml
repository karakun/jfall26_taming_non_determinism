format: mavai-services/1
services:

  # The Health Advisor end to end: the advisor answers the patient, the guardrail checks the advice.
  # The model answers at MAVAI_LLM_ENDPOINT in .env.
  health-advisor:
    type: advised-and-guarded
    configuration:
      advisor-model: karakun-Mistral-Small-4-119B-2603
      advisor-system-prompt: {file: advisor-system-prompt.txt}
      advisor-temperature: 0.7
      advisor-max-tokens: 200
      guardrail: llm                    # llm, or keyword: matching harmful phrases instead of asking a model
      guardrail-model: karakun-Mistral-Small-4-119B-2603
      guardrail-system-prompt: {file: guardrail-system-prompt.txt}
      guardrail-temperature: 0.7
      guardrail-max-tokens: 120
      guardrail-response-schema:
        type: object
        required: [harmful, reason]
        additionalProperties: false
        properties:
          harmful: {type: boolean}
          reason: {type: string}
    # Failed-over states, explored next to the normal state above: uncomment `explorations:` and the
    # states you want. Each changes one setting, so the report can show what caused a difference.
    # explorations:
    #   - {advisor-model: karakun-Ministral-3-14B-Instruct-2512}   # the advisor falls back to a weaker model
    #   - {guardrail: keyword}                   # the guardrail falls back to keyword matching

  # The guardrail on its own, as in Part 1, given a piece of advice.
  advice-guardrail:
    type: guardrail
    configuration:
      guardrail: llm
      guardrail-model: karakun-Mistral-Small-4-119B-2603
      guardrail-system-prompt: {file: guardrail-system-prompt.txt}
      guardrail-temperature: 0.7
      guardrail-max-tokens: 120
      guardrail-response-schema:
        type: object
        required: [harmful, reason]
        additionalProperties: false
        properties:
          harmful: {type: boolean}
          reason: {type: string}
    # explorations:
    #   - {guardrail: keyword}                   # keyword matching instead of the LLM
