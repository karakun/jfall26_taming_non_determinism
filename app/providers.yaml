# Provider and model configuration for the Health Advisor app.
# The app tries models in order: primary first, then fallbacks.
format: providers/2

# Default provider configuration (used by models that don't specify their own endpoint)
provider:
  endpoint: ENV                    # Reads from MAVAI_LLM_ENDPOINT in .env or environment
  api-key: ENV                     # Reads from MAVAI_LLM_API_KEY in .env or environment

# Model selection
models:
  # Primary model
  primary:
    name: mistral-small
    model: mistralai/Mistral-Small-4-119B-2603

  # Fallback models (tried in order when primary fails)
  fallback:
    - name: ministral-3b
      model: mistralai/Ministral-3-14B-Instruct-2512
      enabled: true

    # Local Ollama (uses its own endpoint, not the default provider)
    - name: llama3.2-local
      model: llama3.2:1b
      endpoint: http://localhost:11434/v1/chat/completions
      api-key: optional
      enabled: true
      show-in-ui: true            # Set to true if local Ollama is installed

# Message shown when all models fail
fallback-message: "All LLM providers are currently unavailable. Please try again later."
